# Local Postgres for the Aperium collector. `./dev.sh` starts it and waits until healthy.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aperium
      POSTGRES_PASSWORD: aperium
      POSTGRES_DB: aperium
    ports:
      # Loopback only. Not 5432/5433: those are commonly taken by local or other projects' Postgres.
      - "127.0.0.1:${APERIUM_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperium -d aperium"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
